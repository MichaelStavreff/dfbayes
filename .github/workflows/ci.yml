name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ruff
        run: uvx --from ruff==0.17.3 ruff check

      - name: Mypy
        run: uvx --from mypy==2.4.1 mypy

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Fixtures are committed and were generated by R's DFBA 0.1.0. The test
      # suite replays them, so CI does NOT install or require R. Fixture
      # regeneration is a separate, manual workflow (regenerate-fixtures.yml).
      - name: Install (with pandas and matplotlib extras)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  test-minimal:
    name: pytest (minimal dependencies)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # No pandas and no matplotlib: exercise the pure runtime dependencies and
      # confirm optional-dependency tests skip rather than fail.
      - name: Install runtime dependencies only
        run: uv sync --locked --no-dev

      - name: Install pytest
        run: uv pip install pytest

      - name: Run tests without optional extras
        run: uv run --no-sync pytest -q

  test-floor:
    name: pytest (numpy/scipy floor, Python 3.10)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.10"

      # Check the declared minimums in pyproject.toml rather than the latest
      # versions the lock file resolves to.
      - name: Install numpy 1.24 and scipy 1.10
        run: |
          uv venv --python 3.10
          uv pip install "numpy==1.24.4" "scipy==1.10.1" pytest
          uv pip install --no-deps -e .

      - name: Run tests against the dependency floor
        run: uv run --no-sync pytest -q

  build:
    name: build, metadata and install smoke test
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" - <<'PY'
          import dfbayes

          result = dfbayes.dfba_binomial(n1=16, n2=2)
          assert 0.0 <= result.phimean <= 1.0
          print(dfbayes.__version__, result.R_CLASS)
          PY

      - name: Install the sdist in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/pip" install --quiet dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/python" -c "import dfbayes; print(dfbayes.__version__)"
