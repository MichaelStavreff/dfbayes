name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Fixtures are committed and were generated by R's DFBA 0.1.0. The test
      # suite replays them, so CI does NOT install or require R. Fixture
      # regeneration is a separate, manual workflow (regenerate-fixtures.yml).
      - name: Install (with pandas and matplotlib extras)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

  test-minimal:
    name: pytest (minimal dependencies)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # No pandas and no matplotlib: exercise the pure runtime dependencies and
      # confirm optional-dependency tests skip rather than fail.
      - name: Install runtime dependencies only
        run: uv sync --locked --no-dev

      - name: Install pytest
        run: uv pip install pytest

      - name: Run tests without optional extras
        run: uv run --no-sync pytest -q
