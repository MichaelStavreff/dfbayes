name: Regenerate fixtures

# Manual only. Fixture regeneration needs R and the pinned upstream DFBA
# package, so it must not gate pull requests. PR CI replays the committed
# fixtures and never installs R.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate fixtures with R DFBA 0.1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Fixtures are generated with this exact R version. Do not use
          # "release": the Mersenne-Twister stream and the fixture diff check
          # must stay reproducible.
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install pinned DFBA 0.1.0 from the CRAN archive
        run: |
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/DFBA/DFBA_0.1.0.tar.gz", repos = NULL, type = "source")'
          Rscript -e 'stopifnot(as.character(packageVersion("DFBA")) == "0.1.0")'

      - uses: taiki-e/install-action@just

      - name: Regenerate deterministic fixtures
        run: just fixtures

      - name: Regenerate stochastic fixtures
        run: just fixtures-stochastic

      - name: Show fixture diff
        run: git diff --stat

      # The only expected difference is meta.generated_utc. Anything else means
      # the committed fixtures were not purely produced by this R run.
      - name: Verify only the generation timestamp moved
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          paths = [
              "tests/fixtures/fixtures.json",
              "tests/fixtures/stochastic.json",
          ]
          failed = False
          for path in paths:
              head = json.loads(subprocess.check_output(["git", "show", f"HEAD:{path}"]))
              work = json.load(open(path, "rb"))
              head["meta"].pop("generated_utc", None)
              work["meta"].pop("generated_utc", None)
              if head != work:
                  failed = True
                  print(f"FAIL: {path} changed beyond meta.generated_utc")
              else:
                  print(f"OK: {path} differs only in meta.generated_utc")
          sys.exit(1 if failed else 0)
          PY

      - name: Upload regenerated fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-fixtures
          path: |
            tests/fixtures/fixtures.json
            tests/fixtures/inputs.json
            tests/fixtures/stochastic.json
          if-no-files-found: error
