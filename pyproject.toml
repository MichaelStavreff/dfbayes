[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfbayes"
version = "0.1.0"
description = "Distribution-free Bayesian analysis: a faithful Python port of R's DFBA"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
authors = [
  { name = "dfbayes contributors" },
]
keywords = ["bayesian", "distribution-free", "nonparametric", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
plot = ["matplotlib>=3.6"]
all = ["pandas>=1.5", "matplotlib>=3.6"]

[project.urls]
Upstream = "https://CRAN.R-project.org/package=DFBA"

[dependency-groups]
dev = [
  "pytest>=8",
  "pandas>=1.5",
  "matplotlib>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dfbayes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
